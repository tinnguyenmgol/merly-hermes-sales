services:
  merly_chat_qa:
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    stop_grace_period: 75s
    expose: ["8080"]
    environment:
      MERLY_QA_AUTH_TOKEN: ${MERLY_QA_AUTH_TOKEN:?Set a NEW secret in Coolify}
      MERLY_QA_PUBLIC_HOST: ${MERLY_QA_PUBLIC_HOST:?Set the QA hostname only}
      MERLY_QA_LIVE_TESTS_APPROVED: ${MERLY_QA_LIVE_TESTS_APPROVED:-0}
      MERLY_QA_STATE_DIR: /data
    volumes:
      - qa_limits:/data
    tmpfs:
      - /run/qa:rw,nosuid,nodev,noexec,size=16m,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  qa_limits: {}
