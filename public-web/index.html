<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tư vấn giày Merly</title><link rel="stylesheet" href="/public.css"><script src="/public.js" defer></script></head><body><main>
<header><h1>Merly · Tư vấn giày nữ</h1><p>Tìm mẫu, chọn size và kiểm tra hàng từ Merly.</p></header>
<div id="conversation" aria-live="polite"></div><p id="status" role="status">Đang kết nối…</p>
<form id="chat"><label for="message">Bạn muốn tìm mẫu hoặc size nào?</label><textarea id="message" rows="3" maxlength="1000" required></textarea>
<label class="consent"><input id="consent" type="checkbox" required> Tôi đồng ý xử lý tin nhắn để tư vấn. Chat sử dụng AI và có thể lưu lịch sử. Không gửi mật khẩu, thông tin thẻ hoặc dữ liệu nhạy cảm.</label>
<button id="send" disabled>Gửi</button></form><footer>Giá và tồn là thông tin tại thời điểm tra, chưa giữ hàng. Chat chưa tự tạo đơn hay nhận thanh toán.</footer></main></body></html>
